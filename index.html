<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="appTitle">Auto Selfie Gallery</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #22c55e;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 0.85rem 1.25rem;
      background-color: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
      gap: 0.5rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
    }

    .brand span {
      color: var(--accent);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: nowrap;
    }

    .traffic-badge {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border);
      padding: 0.35rem 0.6rem;
      border-radius: 0.5rem;
      font-size: 0.75rem;
      font-family: monospace;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 0.3rem;
      white-space: nowrap;
    }

    .btn {
      padding: 0.45rem 0.85rem;
      border-radius: 0.5rem;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      white-space: nowrap;
    }

    .btn-primary {
      background-color: var(--accent);
      color: var(--bg-dark);
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
    }

    .btn-secondary {
      background-color: var(--card-bg);
      border-color: var(--border);
      color: var(--text);
    }

    .btn-secondary:hover {
      background-color: var(--border);
    }

    .btn-danger {
      background-color: var(--danger);
      color: white;
    }

    main {
      flex: 1;
      padding: 1.25rem;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    .gallery-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.25rem;
    }

    .photo-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1rem;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
      position: relative;
    }

    /* Batas tinggi maksimum foto di layar mobile agar tidak meluap */
    .photo-wrapper {
      position: relative;
      width: 100%;
      padding-top: 133.33%; /* 3:4 aspect ratio */
      max-height: 55vh;
      background-color: #0b0f19;
      overflow: hidden;
    }

    .photo-wrapper img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      max-height: 55vh;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .photo-card:hover .photo-wrapper img {
      transform: scale(1.03);
    }

    .photo-meta {
      padding: 0.65rem 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      font-size: 0.8rem;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
    }

    .badge {
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent);
      padding: 0.2rem 0.4rem;
      border-radius: 0.25rem;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .comment-section {
      padding: 0.75rem 0.85rem;
      background-color: rgba(15, 23, 42, 0.5);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .comment-list {
      max-height: 100px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    /* Menghilangkan instruksi kosong jika tidak ada komentar */
    .comment-list:empty {
      display: none;
    }

    .comment-item {
      background-color: var(--bg-dark);
      border: 1px solid var(--border);
      padding: 0.35rem 0.5rem;
      border-radius: 0.375rem;
      font-size: 0.75rem;
      line-height: 1.3;
      word-break: break-word;
    }

    .comment-ip {
      color: var(--accent);
      font-weight: 700;
      font-family: monospace;
      font-size: 0.7rem;
    }

    .comment-text {
      color: var(--text);
    }

    .comment-input-group {
      display: flex;
      gap: 0.4rem;
    }

    .comment-input-group input {
      flex: 1;
      font-size: 0.75rem;
      padding: 0.4rem 0.6rem;
      background-color: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: 0.375rem;
      color: var(--text);
      outline: none;
    }

    .comment-input-group input:focus {
      border-color: var(--accent);
    }

    .panel-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      z-index: 99;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .panel-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .panel {
      position: fixed;
      right: -420px;
      top: 0;
      width: 400px;
      max-width: 90vw;
      height: 100vh;
      background-color: var(--card-bg);
      border-left: 1px solid var(--border);
      z-index: 100;
      padding: 1.5rem;
      box-shadow: -10px 0 25px rgba(0, 0, 0, 0.5);
      transition: right 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .panel.active {
      right: 0;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.75rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .video-preview-wrapper {
      position: relative;
      width: 100%;
      border-radius: 0.5rem;
      overflow: hidden;
      background: #000;
      border: 1px solid var(--border);
      padding-top: 133.33%;
    }

    #webcamVideo {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #cropCanvas {
      display: none;
    }

    .status-box {
      font-size: 0.75rem;
      padding: 0.6rem;
      border-radius: 0.5rem;
      background-color: var(--bg-dark);
      border: 1px solid var(--border);
      min-height: 50px;
      max-height: 120px;
      overflow-y: auto;
      font-family: monospace;
      color: var(--text-muted);
    }

    .status-box .log-success { color: var(--success); }
    .status-box .log-error { color: var(--danger); }
    .status-box .log-info { color: var(--accent); }

    /* Media Queries untuk Layar Seluler */
    @media (max-width: 640px) {
      header {
        padding: 0.6rem 0.85rem;
      }

      .btn-text {
        display: none;
      }

      .traffic-badge span {
        font-size: 0.7rem;
      }

      .gallery-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="brand">
      <span id="uiBrandLogo"></span> <span id="uiBrandName"></span>
    </div>
    <div class="header-actions">
      <div class="traffic-badge" id="bandwidthBadge" title="Total Bandwidth Terpakai">
        ⚡ <span>0 KB</span>
      </div>
      <button class="btn btn-secondary" onclick="togglePanel()" title="Control Panel">⚙️ <span class="btn-text">Control</span></button>
      <button class="btn btn-primary" id="uiBtnCapture" onclick="manualCaptureTrigger()" title="Take Photo">📸 <span class="btn-text">Capture</span></button>
    </div>
  </header>

  <!-- Gallery Main Content -->
  <main>
    <div class="gallery-header">
      <div>
        <h2 id="uiGalleryTitle"></h2>
        <p id="uiGallerySubtitle" style="color: var(--text-muted); font-size: 0.85rem;"></p>
      </div>
      <button class="btn btn-secondary" onclick="refreshGallery(true)">🔄 <span class="btn-text">Refresh</span></button>
    </div>

    <div class="gallery-grid" id="galleryContainer">
      <!-- Cards di-render secara dinamis oleh JS berdasarkan MAX_PHOTOS -->
    </div>
  </main>

  <!-- Side Control Panel -->
  <div class="panel-overlay" id="panelOverlay" onclick="togglePanel()"></div>
  <div class="panel" id="controlPanel">
    <div class="panel-header">
      <h3>Panel Pengaturan</h3>
      <button class="btn btn-secondary" style="padding: 0.25rem 0.5rem;" onclick="togglePanel()">✕</button>
    </div>

    <div class="form-group">
      <label>Statistik Penggunaan Traffic:</label>
      <div style="background: var(--bg-dark); padding: 0.75rem; border-radius: 0.5rem; border: 1px solid var(--border); font-size: 0.8rem; line-height: 1.5;">
        <div>Total Bandwidth Downloaded: <b id="statTotalTraffic" style="color:var(--accent);">0 KB</b></div>
        <div>Respons ETag 304 (Hemat): <b id="statETagHits" style="color:var(--success);">0 kali</b></div>
      </div>
    </div>

    <div class="form-group">
      <label>Preview Webcam (Crop 9:16 Portrait):</label>
      <div class="video-preview-wrapper">
        <video id="webcamVideo" autoplay playsinline muted></video>
      </div>
    </div>

    <div class="form-group" style="gap: 0.75rem;">
      <button class="btn btn-primary" id="btnToggleTimer" onclick="toggleAutoCapture()"></button>
      <button class="btn btn-secondary" onclick="captureAndUploadProcess()">📸 Ambil & Upload Sekarang</button>
    </div>

    <div class="form-group">
      <label>Status & Log Eksekusi:</label>
      <div class="status-box" id="logBox"></div>
    </div>
  </div>

  <canvas id="cropCanvas"></canvas>

  <script>
    const APP_CONFIG = {
      REPO_OWNER: "tryout-gratis",
      REPO_NAME: "lion",
      PHOTOS_PATH: "photos",
      MANIFEST_FILE: "gallery_manifest.json",
      MAX_PHOTOS: 4,
      AUTO_CAPTURE_MINUTES: 5, 
      AUTO_REFRESH_INTERVAL: 60000,
      CLOUDFLARE_DOMAIN: "seelion.pages.dev",

      APP_TITLE: "Auto Selfie Album",
      BRAND_NAME: "Couple",
      BRAND_LOGO: "🦁",
      GALLERY_TITLE: "4 Foto Terkini",
      GALLERY_SUBTITLE: "Front Cam",
      
      get BTN_AUTO_CAPTURE_START() {
        return `▶ Mulai Auto-Capture (${this.AUTO_CAPTURE_MINUTES} Menit)`;
      },
      BTN_AUTO_CAPTURE_STOP: "⏹ Stop Auto-Capture",

      BADGE_LATEST: "Terbaru #1",
      BADGE_OLDER_PREFIX: "Foto #",
      LOG_INITIAL_STATUS: "Menunggu aksi...",
      LOG_SUCCESS_TOKEN: "Token GitHub disinkronkan dari Cloudflare Variables.",

      get AUTO_CAPTURE_INTERVAL() {
        return this.AUTO_CAPTURE_MINUTES * 60 * 1000;
      }
    };

    let autoCaptureTimer = null;
    let webcamStream = null;
    let photoIndex = parseInt(localStorage.getItem("ring_buffer_photo_index") || "0", 10);

    const etagCache = new Map();
    let totalDownloadedBytes = parseInt(localStorage.getItem("total_downloaded_bytes") || "0", 10);
    let etagHitCounter = parseInt(localStorage.getItem("etag_hit_counter") || "0", 10);

    const video = document.getElementById("webcamVideo");
    const canvas = document.getElementById("cropCanvas");

    function safeBtoa(str) {
      return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, (match, p1) => String.fromCharCode('0x' + p1)));
    }

    function safeAtob(str) {
      try {
        const cleanStr = str.replace(/[\r\n\s]/g, "");
        return decodeURIComponent(Array.prototype.map.call(atob(cleanStr), c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
      } catch (e) {
        return null;
      }
    }

    function updateTrafficStats(bytesReceived = 0) {
      totalDownloadedBytes += bytesReceived;
      localStorage.setItem("total_downloaded_bytes", totalDownloadedBytes.toString());
      localStorage.setItem("etag_hit_counter", etagHitCounter.toString());

      const formatted = formatBytes(totalDownloadedBytes);
      
      const badge = document.getElementById("bandwidthBadge");
      if (badge) badge.innerHTML = `⚡ <span>${formatted}</span>`;
      
      const statTraffic = document.getElementById("statTotalTraffic");
      if (statTraffic) statTraffic.textContent = formatted;

      const statEtag = document.getElementById("statETagHits");
      if (statEtag) statEtag.textContent = `${etagHitCounter} kali`;
    }

    function formatBytes(bytes, decimals = 2) {
      if (bytes === 0) return "0 KB";
      const k = 1024;
      const dm = decimals < 0 ? 0 : decimals;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
    }

    async function smartFetch(url, options = {}) {
      const headers = options.headers || {};
      const cachedEtag = etagCache.get(url)?.etag;

      if (cachedEtag) {
        headers["If-None-Match"] = cachedEtag;
      }

      const res = await fetch(url, { ...options, headers });

      if (res.status === 304) {
        etagHitCounter++;
        updateTrafficStats(0);
        return { data: etagCache.get(url).data, notModified: true };
      }

      if (res.ok) {
        const newEtag = res.headers.get("ETag");
        const contentLength = parseInt(res.headers.get("Content-Length") || "0", 10);

        let data;
        const contentType = res.headers.get("Content-Type") || "";
        if (contentType.includes("application/json")) {
          data = await res.json();
          const approxSize = contentLength || JSON.stringify(data).length;
          updateTrafficStats(approxSize);
        } else {
          data = await res.blob();
          updateTrafficStats(contentLength || data.size);
        }

        if (newEtag) {
          etagCache.set(url, { etag: newEtag, data: data });
        }
        return { data: data, notModified: false };
      }

      return { data: null, notModified: false };
    }

    const ManifestModule = {
      createDefaultManifest() {
        const slots = {};
        for (let i = 1; i <= APP_CONFIG.MAX_PHOTOS; i++) {
          slots[i] = {
            created_at: null,
            comments: []
          };
        }
        return { slots };
      },

      async getManifest(token) {
        const filename = APP_CONFIG.MANIFEST_FILE;
        const url = `https://api.github.com/repos/${APP_CONFIG.REPO_OWNER}/${APP_CONFIG.REPO_NAME}/contents/${APP_CONFIG.PHOTOS_PATH}/${filename}`;
        
        try {
          const headers = token ? { "Authorization": `Bearer ${token}`, "Accept": "application/vnd.github+json" } : {};
          const { data } = await smartFetch(url, { headers });

          if (data && data.content) {
            const decoded = safeAtob(data.content);
            const parsed = JSON.parse(decoded || "{}");
            if (!parsed.slots) parsed.slots = {};
            return { manifest: parsed, sha: data.sha };
          }
        } catch (e) {
          console.warn("Gagal membaca manifest:", e);
        }

        return { manifest: this.createDefaultManifest(), sha: null };
      },

      async saveManifest(manifestData, sha, token) {
        const filename = APP_CONFIG.MANIFEST_FILE;
        const jsonString = JSON.stringify(manifestData, null, 2);
        const base64Content = safeBtoa(jsonString);

        return await uploadFileToGitHub(filename, base64Content, token, sha);
      }
    };

    const CommentModule = {
      async getPublicIP() {
        try {
          const { data } = await smartFetch("https://api.ipify.org?format=json");
          if (data && data.ip) {
            const parts = data.ip.split(".");
            if (parts.length === 4) return `${parts[0]}.${parts[1]}`;
            return data.ip;
          }
          return "IP Unknown";
        } catch (err) {
          return "IP Unknown";
        }
      },

      escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
      },

      renderCommentsFromManifest(comments, slotNumber) {
        const container = document.getElementById(`comments-list-slot-${slotNumber}`);
        if (!container) return;

        if (!comments || comments.length === 0) {
          container.innerHTML = "";
          return;
        }

        container.innerHTML = comments.map(c => `
          <div class="comment-item">
            <span class="comment-ip">${c.ip}</span>: 
            <span class="comment-text">${this.escapeHtml(c.text)}</span>
          </div>
        `).join("");
      },

      async postComment(slotNumber) {
        const token = getToken();
        const input = document.getElementById(`input-slot-${slotNumber}`);
        if (!input) return;
        const text = input.value.trim();

        if (!text) return;
        if (!token) {
          log("Otentikasi Cloudflare token diperlukan untuk menyimpan komentar!", "error");
          return;
        }

        try {
          log(`[Komentar Slot ${slotNumber}] Mengambil IP public...`, "info");
          const userIP = await this.getPublicIP();

          log(`[Komentar Slot ${slotNumber}] Mengunggah komentar ke manifest...`, "info");
          const { manifest, sha } = await ManifestModule.getManifest(token);

          if (!manifest.slots[slotNumber]) {
            manifest.slots[slotNumber] = { created_at: new Date().toISOString(), comments: [] };
          }

          manifest.slots[slotNumber].comments.push({
            ip: userIP,
            text: text,
            timestamp: new Date().toISOString()
          });

          await ManifestModule.saveManifest(manifest, sha, token);

          input.value = "";
          log(`[Komentar Slot ${slotNumber}] Komentar terkirim!`, "success");
          refreshGallery(true);
        } catch (err) {
          log(`[Komentar Slot ${slotNumber}] Gagal: ` + err.message, "error");
        }
      }
    };

    function initUI() {
      document.title = APP_CONFIG.APP_TITLE;
      document.getElementById("uiBrandLogo").textContent = APP_CONFIG.BRAND_LOGO;
      document.getElementById("uiBrandName").textContent = APP_CONFIG.BRAND_NAME;
      document.getElementById("uiGalleryTitle").textContent = APP_CONFIG.GALLERY_TITLE;
      document.getElementById("uiGallerySubtitle").textContent = APP_CONFIG.GALLERY_SUBTITLE;
      document.getElementById("btnToggleTimer").textContent = APP_CONFIG.BTN_AUTO_CAPTURE_START;
      document.getElementById("logBox").textContent = APP_CONFIG.LOG_INITIAL_STATUS;

      const container = document.getElementById("galleryContainer");
      container.innerHTML = "";
      
      for (let i = 1; i <= APP_CONFIG.MAX_PHOTOS; i++) {
        const cardHtml = `
          <div class="photo-card" id="card-pos-${i}">
            <div class="photo-wrapper"><img src="" alt="Photo Posisi ${i}" onerror="handleImgError(this)" /></div>
            <div class="photo-meta"><span class="badge">-</span><span class="timestamp">-</span></div>
            <div class="comment-section">
              <div class="comment-list" id="comments-list-slot-${i}"></div>
              <div class="comment-input-group" id="comment-group-slot-${i}">
                <input type="text" id="input-slot-${i}" placeholder="Tulis komentar..." />
                <button class="btn btn-primary" id="btn-send-slot-${i}" style="padding: 0.25rem 0.5rem; font-size: 0.75rem;">Kirim</button>
              </div>
            </div>
          </div>
        `;
        container.insertAdjacentHTML("beforeend", cardHtml);
      }

      updateTrafficStats(0);
    }

    window.addEventListener("DOMContentLoaded", async () => {
      initUI();
      await loadTokenFromCloudflare();

      initWebcam();
      refreshGallery();

      setInterval(refreshGallery, APP_CONFIG.AUTO_REFRESH_INTERVAL);
    });

    async function loadTokenFromCloudflare() {
      try {
        const isCloudflareOrigin = window.location.hostname.includes(APP_CONFIG.CLOUDFLARE_DOMAIN);
        const endpoint = isCloudflareOrigin ? "/api/token" : `https://${APP_CONFIG.CLOUDFLARE_DOMAIN}/api/token`;

        const { data } = await smartFetch(endpoint, { method: "GET", headers: { "Accept": "application/json" } });
        if (data && data.token) {
          localStorage.setItem("gh_pat_token", data.token);
          log(APP_CONFIG.LOG_SUCCESS_TOKEN, "success");
        }
      } catch (err) {
        console.warn("Gagal memuat token dari Cloudflare:", err);
      }
    }

    window.addEventListener("keydown", (e) => {
      if (e.altKey && (e.key === "c" || e.key === "C")) {
        e.preventDefault();
        manualCaptureTrigger();
      }
    });

    function log(msg, type = "info") {
      const logBox = document.getElementById("logBox");
      const time = new Date().toLocaleTimeString();
      const div = document.createElement("div");
      div.className = `log-${type}`;
      div.innerText = `[${time}] ${msg}`;
      logBox.prepend(div);
    }

    function togglePanel() {
      document.getElementById("controlPanel").classList.toggle("active");
      document.getElementById("panelOverlay").classList.toggle("active");
    }

    function getToken() {
      return localStorage.getItem("gh_pat_token") || "";
    }

    async function initWebcam() {
      try {
        webcamStream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: false
        });
        video.srcObject = webcamStream;
        log("Webcam berhasil diakses.", "success");
      } catch (err) {
        log("Gagal mengakses webcam: " + err.message, "error");
      }
    }

    function capturePortraitBase64() {
      const vWidth = video.videoWidth;
      const vHeight = video.videoHeight;

      if (!vWidth || !vHeight) {
        throw new Error("Frame webcam belum siap.");
      }

      const targetRatio = 9 / 16;
      let sWidth, sHeight, sx, sy;

      if (vWidth / vHeight > targetRatio) {
        sHeight = vHeight;
        sWidth = vHeight * targetRatio;
        sx = (vWidth - sWidth) / 2;
        sy = 0;
      } else {
        sWidth = vWidth;
        sHeight = vWidth / targetRatio;
        sx = 0;
        sy = (vHeight - sHeight) / 2;
      }

      canvas.width = 720;
      canvas.height = 1280;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(video, sx, sy, sWidth, sHeight, 0, 0, canvas.width, canvas.height);
      
      const dataUrl = canvas.toDataURL("image/jpeg", 0.85);
      return dataUrl.replace(/^data:image\/(png|jpeg|jpg);base64,/, "");
    }

    async function fetchFileInfo(filename, token) {
      if (!token) return null;
      try {
        const url = `https://api.github.com/repos/${APP_CONFIG.REPO_OWNER}/${APP_CONFIG.REPO_NAME}/contents/${APP_CONFIG.PHOTOS_PATH}/${filename}`;
        const { data } = await smartFetch(url, {
          headers: {
            "Authorization": `Bearer ${token}`,
            "Accept": "application/vnd.github+json"
          }
        });
        return data;
      } catch (e) {
        return null;
      }
    }

    async function uploadFileToGitHub(filename, base64Content, token, sha = null) {
      const url = `https://api.github.com/repos/${APP_CONFIG.REPO_OWNER}/${APP_CONFIG.REPO_NAME}/contents/${APP_CONFIG.PHOTOS_PATH}/${filename}`;
      const payload = {
        message: `Auto-update ${filename} [skip ci]`,
        content: base64Content
      };
      if (sha) payload.sha = sha;

      const res = await fetch(url, {
        method: "PUT",
        headers: {
          "Authorization": `Bearer ${token}`,
          "Content-Type": "application/json",
          "Accept": "application/vnd.github+json"
        },
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.message || "Gagal upload ke GitHub");
      }
      return await res.json();
    }

    async function captureAndUploadProcess() {
  const token = getToken();
  if (!token) {
    log("Token Cloudflare belum siap!", "error");
    return;
  }

  try {
    log("Mengambil frame portrait...", "info");
    const newPhotoBase64 = capturePortraitBase64();

    const targetSlot = (photoIndex % APP_CONFIG.MAX_PHOTOS) + 1;
    const targetPhotoName = `photo_${targetSlot}.jpg`;

    log(`[Slot Target ${targetSlot}] Mengunggah foto ke GitHub...`, "info");

    const photoFileInfo = await fetchFileInfo(targetPhotoName, token);
    await uploadFileToGitHub(targetPhotoName, newPhotoBase64, token, photoFileInfo ? photoFileInfo.sha : null);

    log(`[Slot Target ${targetSlot}] Memperbarui manifest...`, "info");
    const { manifest, sha } = await ManifestModule.getManifest(token);

    // Pertahankan komentar lama jika slot tersebut sudah ada sebelumnya,
    // atau gunakan array kosong [] HANYA jika slot tersebut benar-benar belum pernah dibuat.
    const existingComments = (manifest.slots && manifest.slots[targetSlot] && manifest.slots[targetSlot].comments) 
      ? manifest.slots[targetSlot].comments 
      : [];

    manifest.slots[targetSlot] = {
      created_at: new Date().toISOString(),
      comments: existingComments // <-- Komentar tetap dipertahankan meski foto diperbarui
    };

    await ManifestModule.saveManifest(manifest, sha, token);

    photoIndex++;
    localStorage.setItem("ring_buffer_photo_index", photoIndex.toString());

    log(`[Berhasil] Foto baru diunggah & menimpa Slot ${targetSlot}!`, "success");
    
    setTimeout(() => refreshGallery(true), 1500);
  } catch (err) {
    log("Error: " + err.message, "error");
  }
}

    function manualCaptureTrigger() {
      log("Pemicu instan diaktifkan (Alt+C / Tombol)", "info");
      captureAndUploadProcess();
    }

    function toggleAutoCapture() {
      const btn = document.getElementById("btnToggleTimer");
      if (autoCaptureTimer) {
        clearInterval(autoCaptureTimer);
        autoCaptureTimer = null;
        btn.textContent = APP_CONFIG.BTN_AUTO_CAPTURE_START;
        btn.className = "btn btn-primary";
        log("Auto-capture dihentikan.", "info");
      } else {
        autoCaptureTimer = setInterval(captureAndUploadProcess, APP_CONFIG.AUTO_CAPTURE_INTERVAL);
        btn.textContent = APP_CONFIG.BTN_AUTO_CAPTURE_STOP;
        btn.className = "btn btn-danger";
        log(`Auto-capture aktif (interval ${APP_CONFIG.AUTO_CAPTURE_MINUTES} menit).`, "success");
        captureAndUploadProcess();
      }
    }

   async function refreshGallery(forceRefresh = false) {
  const token = getToken();

  const { manifest } = await ManifestModule.getManifest(token);
  const slotsData = [];

  for (let i = 1; i <= APP_CONFIG.MAX_PHOTOS; i++) {
    const photoName = `photo_${i}.jpg`;
    const slotManifest = manifest.slots ? manifest.slots[i] : null;

    let createdAt = slotManifest && slotManifest.created_at ? new Date(slotManifest.created_at).getTime() : 0;
    let photoSrc = "";
    let isValid = false;

    try {
      if (token) {
        const photoFile = await fetchFileInfo(photoName, token);
        if (photoFile && photoFile.content) {
          const cleanBase64 = photoFile.content.replace(/[\r\n\s]/g, "");
          photoSrc = `data:image/jpeg;base64,${cleanBase64}`;
          isValid = true;
        }
      } else {
        photoSrc = `https://raw.githubusercontent.com/${APP_CONFIG.REPO_OWNER}/${APP_CONFIG.REPO_NAME}/main/${APP_CONFIG.PHOTOS_PATH}/${photoName}?t=${Date.now()}`;
        isValid = true;
      }

      if (isValid && createdAt === 0) {
        createdAt = Date.now();
      }

      slotsData.push({
        slot: i,
        timestamp: createdAt,
        src: photoSrc,
        valid: isValid,
        comments: slotManifest ? slotManifest.comments || [] : []
      });
    } catch (err) {
      slotsData.push({ slot: i, timestamp: 0, src: "", valid: false, comments: [] });
    }
  }

  // Urutkan foto dari yang paling baru ke paling lama
  slotsData.sort((a, b) => b.timestamp - a.timestamp);

  slotsData.forEach((item, index) => {
    const cardDOMIndex = index + 1;
    const card = document.getElementById(`card-pos-${cardDOMIndex}`);
    if (!card) return;
    
    const img = card.querySelector("img");
    const badge = card.querySelector(".badge");
    const timeLabel = card.querySelector(".timestamp");
    const commentListDiv = card.querySelector(".comment-list");
    const inputElem = card.querySelector("input");
    const btnElem = card.querySelector("button.btn-primary");

    // Tetapkan ID baru ke elemen UI sesuai slot foto yang menempatinya
    if (commentListDiv) commentListDiv.id = `comments-list-slot-${item.slot}`;
    if (inputElem) inputElem.id = `input-slot-${item.slot}`;
    if (btnElem) {
      btnElem.id = `btn-send-slot-${item.slot}`;
      btnElem.onclick = () => CommentModule.postComment(item.slot);
    }
    if (inputElem) {
      inputElem.onkeydown = (e) => {
        if (e.key === "Enter") CommentModule.postComment(item.slot);
      };
    }

    if (item.valid && item.src) {
      img.src = item.src;
      badge.textContent = index === 0 ? APP_CONFIG.BADGE_LATEST : `${APP_CONFIG.BADGE_OLDER_PREFIX}${index + 1}`;
      
      if (item.timestamp > 0) {
        const dateObj = new Date(item.timestamp);
        timeLabel.textContent = dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      } else {
        timeLabel.textContent = `Slot #${item.slot}`;
      }
    } else {
      handleImgError(img);
      badge.textContent = `${APP_CONFIG.BADGE_OLDER_PREFIX}${index + 1}`;
      timeLabel.textContent = "Kosong";
    }

    // SELALU Render komentar sesuai slot spesifik foto ini
    CommentModule.renderCommentsFromManifest(item.comments, item.slot);
  });
}

    function handleImgError(img) {
      img.src = "data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22720%22%20height%3D%221280%22%20viewBox%3D%220%200%20720%201280%22%3E%3Crect%20fill%3D%22%231e293b%22%20width%3D%22720%22%20height%3D%221280%22%2F%3E%3Ctext%20fill%3D%22%2364748b%22%20font-family%3D%22sans-serif%22%20font-size%3D%2228%22%20dy%3D%2210.5%22%20font-weight%3D%22bold%22%20x%3D%2250%25%22%20y%3D%2250%25%22%20text-anchor%3D%22middle%22%3EBelum%20Ada%20Foto%3C%2Ftext%3E%3C%2Fsvg%3E";
    }
  </script>
